# ddev-generated
# Docker compose file for localtunnel service
---
version: '3.6'

services:
  localtunnel:
    container_name: ddev-${DDEV_SITENAME}-localtunnel
    image: node:18-alpine
    restart: "no"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      - DDEV_SITENAME=${DDEV_SITENAME}
    command: >
      sh -c "
        npm install -g localtunnel &&
        echo 'Localtunnel installed, ready to start...' &&
        while true; do sleep 3600; done
      "
    networks: [default, ddev_default]
    depends_on:
      - web

networks:
  ddev_default:
    external: true